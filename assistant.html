<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>FixLink Assistant</title>

  <meta name="theme-color" content="#062b5c">
  <meta name="description" content="FixLink Assistant helps you find the right professional for your job.">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css?v=9">

  <style>
    /* =========================================================
       FIXLINK ASSISTANT PAGE
       ========================================================= */

    .assistant-page {
      min-height: 100vh;
      background: linear-gradient(
        145deg,
        #eef6ff 0%,
        #ffffff 52%,
        #fff7df 100%
      );
      padding-bottom: 40px;
    }

    /* Header */

    .assistant-page .topbar {
      background: rgba(255, 255, 255, 0.92);
      justify-content: flex-start;
      gap: 8px;
      position: relative;
    }

    .assistant-page .brand-link {
      text-decoration: none;
    }

    .assistant-back {
      position: absolute;
      left: calc(4% - 20px);
      top: 50%;
      transform: translateY(-50%);
      color: var(--navy);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      padding: 8px;
    }

    .assistant-back:hover {
      opacity: 0.75;
    }

    /* Main */

    .assistant-main {
      width: min(760px, 92%);
      margin: 54px auto 0;
    }

    .assistant-panel {
      background: #ffffff;
      border: 1px solid #dce8f3;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(6, 43, 92, 0.09);
      padding: 30px;
    }

    /* Header inside assistant */

    .assistant-page .assistant-header {
      padding-right: 0;
    }

    .assistant-page .assistant-header h1 {
      font-size: 30px;
      margin: 10px 0 5px;
    }

    /* Chat area */

    .assistant-page .assistant-log {
      height: 330px;
      overflow-y: auto;
      margin-top: 20px;
    }

    /* Suggestions */

    .assistant-page .assistant-suggestions {
      margin-top: 16px;
    }

    .assistant-page .assistant-suggestions button:disabled,
    .assistant-page .assistant-form button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    /* Input */

    .assistant-page .assistant-form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .assistant-page .assistant-form input {
      flex: 1;
      min-width: 0;
    }

    .assistant-page .assistant-form .primary {
      min-width: 52px;
      padding: 12px;
    }

    /* Recommendation */

    .assistant-page .assistant-result {
      margin-top: 16px;
    }

    .assistant-page .assistant-result[hidden] {
      display: none;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .assistant-main {
        width: 94%;
        margin-top: 28px;
      }

      .assistant-panel {
        padding: 20px;
        border-radius: 16px;
      }

      .assistant-page .assistant-header h1 {
        font-size: 25px;
      }

      .assistant-page .assistant-log {
        height: 300px;
      }

      .assistant-back {
        left: calc(4% - 12px);
      }

      .assistant-page .assistant-form {
        gap: 8px;
      }

      .assistant-page .assistant-form .primary {
        min-width: 48px;
      }
    }
  </style>
</head>

<body class="assistant-page">

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header class="topbar">

    <a
      class="brand-link"
      href="index.html"
      aria-label="Back to FixLink home"
    >
      <div class="brand">

        <img
          src="assets/fixlink-logo.png"
          alt="FixLink"
          class="fixlink-logo"
        >

        <div class="brand-copy">
          <span class="brand-text">
            Fix<span class="brand-accent">Link</span>
          </span>

          <span class="tagline">
            The right hands, right when you need them
          </span>
        </div>

      </div>
    </a>

    <a
      class="assistant-back"
      href="index.html"
      aria-label="Back to FixLink home"
    >
      ←
    </a>

  </header>


  <!-- =======================================================
       ASSISTANT
       ======================================================= -->

  <main class="assistant-main">

    <section
      class="assistant-panel"
      aria-labelledby="assistantTitle"
    >

      <div class="assistant-header">

        <div class="assistant-avatar" aria-hidden="true">
          ✦
        </div>

        <div>

          <span class="pill">
            FIXLINK ASSISTANT
          </span>

          <h1 id="assistantTitle">
            Let’s find the right hands
          </h1>

          <p>
            I’ll understand the problem and point you to the
            right kind of professional.
          </p>

        </div>

      </div>


      <!-- Chat -->

      <div
        class="assistant-log"
        id="assistantLog"
        aria-live="polite"
        aria-label="FixLink Assistant conversation"
      >

        <div class="assistant-bubble received">
          Hi, I’m your FixLink Assistant. What do you need help
          with today?
        </div>

      </div>


      <!-- Quick suggestions -->

      <div
        class="assistant-suggestions"
        id="assistantSuggestions"
      >

        <button
          type="button"
          data-prompt="I have a leaking pipe"
        >
          Leaking pipe
        </button>

        <button
          type="button"
          data-prompt="My lights are not working"
        >
          Electrical problem
        </button>

        <button
          type="button"
          data-prompt="I need help painting my home"
        >
          Painting job
        </button>

        <button
          type="button"
          data-prompt="I need someone to clean my home"
        >
          Home cleaning
        </button>

      </div>


      <!-- Message form -->

      <form
        class="message-form assistant-form"
        id="assistantForm"
      >

        <input
          id="assistantInput"
          type="text"
          required
          autocomplete="off"
          placeholder="Describe your problem..."
          aria-label="Describe your problem"
        >

        <button
          class="primary"
          type="submit"
          aria-label="Ask FixLink Assistant"
        >
          ➤
        </button>

      </form>


      <!-- Recommendation -->

      <div
        class="assistant-result"
        id="assistantResult"
        hidden
      >

        <strong id="assistantRecommendation"></strong>

        <button
          class="primary wide"
          id="findProfessionals"
          type="button"
        >
          View matching professionals
        </button>

      </div>

    </section>

  </main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script src="assistant.js?v=2"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .catch(() => {});
      });
    }
  </script>

</body>
</html>
